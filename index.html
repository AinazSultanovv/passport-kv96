<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
var D=P.data,M=D.meta;
var cv=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setClearColor(0xe2e6ec,1);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(42,1,0.1,200);
var ctr=new THREE.Vector3(4.8,1.2,3.6);
var controls=new THREE.OrbitControls(camera,cv);
controls.enableDamping=true;controls.dampingFactor=0.12;controls.minDistance=1.5;controls.maxDistance=28;controls.maxPolarAngle=Math.PI;controls.target.copy(ctr);
function view(pos,tgt){camera.position.set(pos[0],pos[1],pos[2]);controls.target.set(tgt[0],tgt[1],tgt[2]);controls.update();}
function viewTop(){view([ctr.x+7.5,10.5,ctr.z+8.5],[ctr.x,0.8,ctr.z]);}
function viewBot(){view([ctr.x-6.5,-7.5,ctr.z-7.5],[ctr.x,2.0,ctr.z]);}
viewTop();
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
var loader=new THREE.TextureLoader();
function tex(url,rep){return new Promise(function(res){loader.load(url,function(t){t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}res(t);});});}
var ceilGroup=new THREE.Group(),ptsGroup=new THREE.Group();
scene.add(ceilGroup);scene.add(ptsGroup);
var hitTargets=[];
Promise.all([Promise.all(P.tex.map(function(u){return tex(u,false);})),tex(P.ceil,false),tex(P.floor,true)]).then(function(r){
  var T=r[0],ceilT=r[1],floorT=r[2];
  // стены и окна
  D.quads.forEach(function(q){
    var g=new THREE.BufferGeometry();
    var pos=[],uv=[];q.v.forEach(function(v,i){pos.push(v[0],v[1],v[2]);uv.push(q.uv[i][0],q.uv[i][1]);});
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.setIndex([0,1,2,0,2,3]);
    var m=new THREE.MeshBasicMaterial({map:T[q.t],side:THREE.FrontSide,color:new THREE.Color(q.s,q.s,q.s)});
    if(q.w){m.polygonOffset=true;m.polygonOffsetFactor=-2;m.polygonOffsetUnits=-2;}
    scene.add(new THREE.Mesh(g,m));
  });
  // полы и потолки
  floorT.repeat.set(0.8,0.8);
  D.planes.forEach(function(pl){
    [['floor',0,1],['ceil',2.7,-1]].forEach(function(s){
      var pos=[],uv=[],idx=[];
      pl.P.forEach(function(p){pos.push(p[0],s[1],p[1]);
        if(s[0]==='ceil'){uv.push((p[0]*1000-M.px0)/M.ceil_w,1-(p[1]*1000-M.py0)/M.ceil_h);}else{uv.push(p[0],p[1]);}});
      pl.T.forEach(function(t){
        var A=pl.P[t[0]],B=pl.P[t[1]],C=pl.P[t[2]];
        var nx=(B[1]-A[1])*(C[0]-A[0])-(B[0]-A[0])*(C[1]-A[1]);  // знак нормали по y для порядка (x,z)
        // нормаль = (B-A)x(C-A); y-компонента = (Bz-Az)*(Cx-Ax)-(Bx-Ax)*(Cz-Az)
        if((s[2]>0&&nx<0)||(s[2]<0&&nx>0)) idx.push(t[0],t[2],t[1]); else idx.push(t[0],t[1],t[2]);
      });
      var g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
      g.setIndex(idx);
      var m=new THREE.MeshBasicMaterial({map:s[0]==='ceil'?ceilT:floorT,side:THREE.FrontSide});
      var mesh=new THREE.Mesh(g,m);
      (s[0]==='ceil'?ceilGroup:scene).add(mesh);
    });
  });
  // точки
  var COL={'25':0xd9480f,'15':0x1c7ed6,'lc':0x2f9e44,'ex':0x6e6e6e};
  D.drops.forEach(function(d){
    d.lines.forEach(function(l){
      var len=2.7-d.low;
      var cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,len,8),new THREE.MeshBasicMaterial({color:COL[l[2]]||0x888888}));
      cyl.position.set(l[0],d.low+len/2,l[1]);ptsGroup.add(cyl);
    });
    d.boxes.forEach(function(b){
      var bx=new THREE.Mesh(new THREE.BoxGeometry(0.075,0.075,0.075),new THREE.MeshBasicMaterial({color:0xffffff}));
      bx.position.set(b[0],b[2],b[1]);ptsGroup.add(bx);
      var ed=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.075,0.075,0.075)),new THREE.LineBasicMaterial({color:0x222222}));
      ed.position.copy(bx.position);ptsGroup.add(ed);
    });
    var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');
    x.fillStyle='#c0392b';x.beginPath();x.arc(64,64,58,0,Math.PI*2);x.fill();x.lineWidth=8;x.strokeStyle='#fff';x.stroke();
    x.fillStyle='#fff';x.font='bold 54px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(d.id,64,68);
    var st=new THREE.CanvasTexture(c);
    var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:st,depthTest:false,transparent:true}));
    sp.scale.set(0.36,0.36,1);sp.position.set(d.x,2.78,d.z);sp.renderOrder=10;sp.userData=d;
    ptsGroup.add(sp);hitTargets.push(sp);
  });
  document.getElementById('load').style.display='none';
});
// кнопки
function setOn(b,on){b.classList.toggle('on',on);}
var bTop=document.getElementById('bTop'),bBot=document.getElementById('bBot'),bCeil=document.getElementById('bCeil'),bPts=document.getElementById('bPts');
bTop.onclick=function(){viewTop();setOn(bTop,true);setOn(bBot,false);};
bBot.onclick=function(){viewBot();setOn(bBot,true);setOn(bTop,false);};
bCeil.onclick=function(){ceilGroup.visible=!ceilGroup.visible;setOn(bCeil,ceilGroup.visible);};
bPts.onclick=function(){ptsGroup.visible=!ptsGroup.visible;setOn(bPts,ptsGroup.visible);};
// нажатие на точку
var info=document.getElementById('info'),ray=new THREE.Raycaster(),down=null;
cv.addEventListener('pointerdown',function(e){down=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',function(e){
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6){down=null;return;}
  down=null;
  var r=cv.getBoundingClientRect();
  var v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(v,camera);
  var hit=ray.intersectObjects(hitTargets,false);
  if(hit.length){var d=hit[0].object.userData;
    info.innerHTML='<span class="x" onclick="this.parentNode.style.display=\'none\'">✕</span><b>Точка '+d.id+'</b><br>'+d.ref+'<br>'+d.desc;info.style.display='block';}
  else{info.style.display='none';}
});
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);}
loop();
})();
</script>
</body>
